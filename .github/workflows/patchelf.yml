name: "Patchelf"

on:
  push:
    branches:
      - main
    tags:
      - v0.**
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: patchelf-${{ github.ref }}
  cancel-in-progress: true

env:
  SPACK_COLOR: always
  SPACK_BACKTRACE: please
  PYTHONUNBUFFERED: 1

jobs:
  manylinux2014_build:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        arch: ["amd64", "arm64", "ppc64le"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: ${{ matrix.arch != 'amd64' }}
        with:
          platforms: linux/${{ matrix.arch }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          file: ./patchelf/Dockerfile.manylinux2014
          platforms: linux/${{ matrix.arch }}
          outputs: type=docker
          tags: patchelf:latest

      - run: |
          docker create --name patchelf-c --platform linux/${{ matrix.arch }} patchelf
          docker cp "patchelf-c:/root/binary-mirror" binary-mirror

      - uses: actions/upload-artifact@v5
        with:
          name: patchelf_binary_mirror-linux-${{ matrix.arch}}-${{ matrix.python-version }}
          path: binary-mirror

  patchelf_json:
    runs-on: ubuntu-latest
    needs: [ manylinux2014_build ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: spack/spack
          path: spack
          ref: 734c5db2121b01c373eed6538e452f18887e9e44
      - uses: actions/checkout@v4
        with:
          repository: spack/spack-packages
          path: spack-packages
          ref: a5b98e6b7e411a499f310e048c1d2e39d1004519
      - uses: actions/download-artifact@v6

      - run: |
          . spack/share/spack/setup-env.sh
          spack repo set --destination "$PWD/spack-packages" builtin
          spack python ./generate_bootstrap_json.py patchelf

      - uses: actions/upload-artifact@v5
        with:
          name: patchelf_manifest
          path: patchelf.json
