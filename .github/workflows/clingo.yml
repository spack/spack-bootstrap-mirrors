name: clingo

on:
  push:
    branches:
      - main
    tags:
      - v0.**
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: clingo-${{ github.ref }}
  cancel-in-progress: true

env:
  SPACK_COLOR: always
  SPACK_BACKTRACE: please
  PYTHONUNBUFFERED: 1

