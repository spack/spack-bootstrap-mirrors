  manylinux2014_build:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        arch: ["amd64", "arm64", "ppc64le"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: ${{ matrix.arch != 'amd64' }}
        with:
          platforms: linux/${{ matrix.arch }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          file: ./clingo/Dockerfile.manylinux2014
          platforms: linux/${{ matrix.arch }}
          outputs: type=docker
          tags: clingo:latest
          build-Args: |
            PYTHON_VERSION=${{ matrix.python-version }}

      - run: |
          docker create --name clingo-c --platform linux/${{ matrix.arch }} clingo
          docker cp "clingo-c:/root/binary-mirror" binary-mirror

      - uses: actions/upload-artifact@v5
        with:
          name: clingo_binary_mirror-linux-${{ matrix.arch}}-${{ matrix.python-version }}
          path: binary-mirror

